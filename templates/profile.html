{% extends "base.html" %}
{% block title %}Profile settings | Vornix CP{% endblock %}
{% block page_heading %}Profile settings{% endblock %}

{% block content %}
<div class="section-heading">
    <div>
        <p class="eyebrow">YOUR ACCOUNT</p>
        <h1>Training preferences</h1>
        <p class="muted">Update your Codeforces connection and goals.</p>
    </div>
</div>

<div class="panel settings-panel">
    <form method="POST" class="form-stack">
        <label>Codeforces handle</label>
        <input name="cf_handle" value="{{ user.cf_handle or '' }}" required>

        <label>Target rating</label>
        <input name="target_rating" type="number" min="800" max="4000"
               value="{{ user.target_rating }}" required>

        <label>Practice hours per week</label>
        <input name="weekly_hours" type="number" min="1" max="60"
               value="{{ user.weekly_hours }}" required>

        <button class="primary-button" type="submit">Save changes</button>
    </form>
</div>
{% endblock %}
